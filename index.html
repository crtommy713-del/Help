<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direct Ad Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 0;
    }

    /* Fixed Top Navigation Bar - Always visible at top */
    .app-header {
      width: 100%;
      background-color: #1e1e1e;
      border-bottom: 1px solid #333;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 999;
    }

    .back-nav-btn {
      background-color: #2a2a2a;
      color: #00e676;
      border: 1px solid #00e676;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .back-nav-btn:active {
      background-color: #00e676;
      color: #121212;
    }

    .main-content {
      padding: 20px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      margin-top: 20px;
    }

    .container {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: #00e676;
    }

    p {
      font-size: 0.9rem;
      color: #b0bec5;
      margin-bottom: 20px;
    }

    .stats-card {
      background-color: #2a2a2a;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stats-card span {
      font-size: 0.9rem;
      color: #aaa;
    }

    .stats-card strong {
      font-size: 1.2rem;
      color: #fff;
    }

    .ad-btn {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background-color: #00e676;
      color: #121212;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s, transform 0.1s;
    }

    .ad-btn:active {
      transform: scale(0.98);
      background-color: #00c853;
    }

    .badge {
      display: inline-block;
      background-color: #2a2a2a;
      color: #00e676;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header (Always Visible at Top of Web) -->
  <header class="app-header">
    <button class="back-nav-btn" onclick="goBack()">
      ← Back to App
    </button>
    <div class="badge">Unlimited Mode</div>
  </header>

  <div class="main-content">
    <div class="container">
      <h1>Direct Ad Portal</h1>
      <p>Click below to open the link. Use the top back button anytime to return.</p>

      <div class="stats-card">
        <span>Total Clicks Completed:</span>
        <strong id="click-counter">0</strong>
      </div>

      <!-- Direct Ad Link trigger -->
      <button class="ad-btn" onclick="openAdLink('https://uplcm.com/4/12055952')">
        ⚡ Open Direct Ad Link
      </button>
    </div>
  </div>

  <script>
    // Load local click count
    let clickCount = parseInt(localStorage.getItem('unlimited_ad_clicks')) || 0;
    document.getElementById('click-counter').innerText = clickCount;

    // Back key navigation handler
    function goBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        // Fallback destination if opened directly
        window.location.href = './index.html'; 
      }
    }

    // Open link safely in standard external browser to prevent ERR_UNKNOWN_URL_SCHEME
    function openAdLink(adUrl) {
      clickCount++;
      localStorage.setItem('unlimited_ad_clicks', clickCount);
      document.getElementById('click-counter').innerText = clickCount;

      // Opens in external browser tab so Android intents resolve properly
      const a = document.createElement('a');
      a.href = adUrl;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.click();
    }
  </script>

</body>
</html>
