<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch & Earn / Visit Links</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: #00e676;
    }

    p {
      font-size: 0.9rem;
      color: #b0bec5;
      margin-bottom: 20px;
    }

    .stats-card {
      background-color: #2a2a2a;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stats-card span {
      font-size: 0.9rem;
      color: #aaa;
    }

    .stats-card strong {
      font-size: 1.2rem;
      color: #fff;
    }

    .ad-btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: none;
      border-radius: 8px;
      background-color: #00e676;
      color: #121212;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s, transform 0.1s;
    }

    .ad-btn:active {
      transform: scale(0.98);
      background-color: #00c853;
    }

    .ad-btn.secondary {
      background-color: #2979ff;
      color: #ffffff;
    }

    .ad-btn.secondary:active {
      background-color: #2962ff;
    }

    .badge {
      display: inline-block;
      background-color: #333;
      color: #00e676;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 12px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="badge">Infinity Mode Active</div>
    <h1>Direct Ad Portal</h1>
    <p>Click the button below to view ads unlimited times with no waiting period.</p>

    <div class="stats-card">
      <span>Total Clicks Completed:</span>
      <strong id="click-counter">0</strong>
    </div>

    <!-- Your active direct ad link -->
    <button class="ad-btn" onclick="openAdLink('https://uplcm.com/4/12055952')">
      ⚡ Open Direct Ad Link
    </button>
  </div>

  <script>
    // Load click count from local storage
    let clickCount = parseInt(localStorage.getItem('unlimited_ad_clicks')) || 0;
    document.getElementById('click-counter').innerText = clickCount;

    function openAdLink(adUrl) {
      // Increment click count
      clickCount++;
      localStorage.setItem('unlimited_ad_clicks', clickCount);
      document.getElementById('click-counter').innerText = clickCount;

      // Open ad link in a new tab immediately (No cooldown or timer)
      window.open(adUrl, '_blank');
    }
  </script>

</body>
</html>
